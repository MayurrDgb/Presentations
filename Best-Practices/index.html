<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Best Practices — Fortidia</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;background:#1C3040;font-family:Arial,sans-serif;color:#EDE8E0;}
body{display:flex;align-items:center;justify-content:center;padding:48px 24px;text-align:center;}
.wrap{max-width:620px;}
.logo{font-family:Arial Black,Arial,sans-serif;font-weight:900;color:#F5E800;font-size:30px;letter-spacing:-.5px;margin-bottom:36px;}
.label{font-size:11px;font-weight:700;letter-spacing:3px;color:rgba(245,232,0,.7);margin-bottom:14px;}
h1{font-family:Arial Black,Arial,sans-serif;font-size:52px;font-weight:900;color:#fff;line-height:1.05;margin-bottom:18px;}
.line{width:90px;height:4px;background:#F5E800;border-radius:2px;margin:0 auto 22px;}
p{font-size:16px;color:rgba(255,255,255,.55);line-height:1.6;margin-bottom:32px;}
a.back{display:inline-block;text-decoration:none;font-size:13px;font-weight:700;color:#1C3040;background:#F5E800;border-radius:24px;padding:11px 24px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Fortidia</div>
  <div class="label">BEST PRACTICES</div>
  <h1>Coming soon</h1>

</div>
